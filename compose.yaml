services:
  api:
    build: ./python-src
    ports:
      - "127.0.0.1:5001:5000"
    volumes:
      - movie-data:/app/instance
  web:
    build: ./vue-src
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      API_PROXY_TARGET: http://api:5000
    depends_on:
      - api
volumes:
  movie-data:
