name: Build and test

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: API tests
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: python-src
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.15'
          cache: pip
          cache-dependency-path: python-src/requirements.txt
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Audit Python dependencies
        run: |
          python -m pip install -r requirements-security.txt
          pip-audit -r requirements.txt
      - name: Test API
        run: python -m unittest discover -s tests -v

  frontend:
    name: Frontend lint and build
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: vue-src
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '26'
          cache: npm
          cache-dependency-path: vue-src/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Audit JavaScript dependencies
        run: npm audit
      - name: Lint
        run: npm run lint -- --no-fix
      - name: Build production bundle
        run: npm run build

  research:
    name: Optional SVD dependency checks
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: python-src
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: python-src/requirements-svd.txt
      - name: Install research and audit dependencies
        run: python -m pip install -r requirements-svd.txt -r requirements-security.txt
      - name: Audit research dependencies
        run: pip-audit -r requirements-svd.txt
      - name: Verify SVD with NumPy and pandas
        run: python tests/svd_smoke.py

  docker:
    name: Docker images
    needs: [backend, frontend]
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Validate Compose configuration
        run: docker compose config --quiet
      - name: Build API and web images
        run: docker compose --project-name movie-recommendation build --pull
      - name: Scan container images for high and critical vulnerabilities
        run: |
          docker image save -o "$RUNNER_TEMP/api.tar" movie-recommendation-api
          docker image save -o "$RUNNER_TEMP/web.tar" movie-recommendation-web
          for image in api web; do
            docker run --rm \
              --mount "type=bind,src=$RUNNER_TEMP/$image.tar,dst=/scan/image.tar,readonly" \
              aquasec/trivy:0.76.1@sha256:790fd66d1697395d8693d1acaa1ea702406a20f109b6fc7bac8db623eca6c06c image --scanners vuln --severity HIGH,CRITICAL \
              --exit-code 1 --input /scan/image.tar
          done
